name: Calculator CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Матрица версий: конвейер проверяет совместимость на нескольких
    # поддерживаемых версиях интерпретатора.
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Type Checker (mypy)
        run: |
          mypy calculator.py

      - name: Run Unit Tests (pytest)
        run: |
          pytest test_calculator.py -v

      - name: Check Code Coverage
        run: |
          pytest test_calculator.py --cov=calculator --cov-report=term-missing --cov-fail-under=90
